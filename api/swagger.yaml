      summary: List organizer payments (finance/owner see all; sellers see own manual sales)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, succeeded, failed, refunded, partially_refunded]
        - name: provider
          in: query
          schema:
            type: string
            enum: [stripe, mock, manual]
        - name: eventId
          in: query
          schema:
            type: integer
        - name: recordedByMemberId
          in: query
          description: Filter by seller who recorded a manual sale (owner/finance only). Prefer sellerFilter.
          schema:
            type: integer
        - name: sellerFilter
          in: query
          description: "all (default), online (checkout without seller), or organizer member id"
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Paginated payments list
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        provider:
                          type: string
                          enum: [stripe, mock, manual]
                        recorded_by_member_id:
                          type: integer
                          nullable: true
                        seller_first_name:
                          type: string
                          nullable: true
                        seller_last_name:
                          type: string
                          nullable: true
                        seller_email:
                          type: string
                          nullable: true
                        service_fee_cents:
                          type: integer
                  pagination:
                    type: object
        "403":
          description: Insufficient permissions

  /organizer/payments/seller-summary:
    get:
      tags: [Organizer]
      summary: Manual sales totals grouped by seller (owner/organizer/finance)
      security:
        - bearerAuth: []
