      summary: Paginated list of all events with organizer info
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_approval, published, cancelled, completed]
        - name: organizerId
          in: query
          schema:
            type: integer
        - name: simulation
          in: query
          description: Filter by simulation flag (`1` simulations only, `0` live only, omit for both)
          schema:
            type: string
            enum: ["0", "1", "all"]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [start_date, title, status, registration_count, organizer_name, created_at, id, location_city]
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
      responses:
        "200":
          description: Paginated events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        "400":
          description: Invalid organizerId
    post:
      tags: [Admin]
      summary: Create event for an organizer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizer_id, title, subdomain, sport_type_id, start_date]
              properties:
                organizer_id:
                  type: integer
                title:
                  type: string
                subdomain:
                  type: string
                  description: >
                    Required. Globally unique vanity host label for
                    `{subdomain}.atleita.com`. Immutable after create.
                  minLength: 3
                  maxLength: 63
                sport_type_id:
                  type: integer
                start_date:
                  type: string
                  format: date-time
                slug:
                  type: string
                short_description:
                  type: string
                description:
                  type: string
                visibility:
                  type: string
                  enum: [public, private, unlisted]
                featured:
                  type: boolean
                end_date:
                  type: string
                  format: date-time
                registration_opens_at:
                  type: string
                  format: date-time
                registration_closes_at:
                  type: string
                  format: date-time
                location_name:
                  type: string
                location_city:
                  type: string
                hero_image_url:
                  type: string
                max_registrations:
                  type: integer
                max_registrations_per_order:
                  type: integer
                bib_mode:
                  $ref: "#/components/schemas/EventBibMode"
