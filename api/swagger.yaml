        "409":
          description: Recipient already registered

  /events/{slug}/register/checkout:
    post:
      tags: [Marketplace]
      summary: Create pending registration and Stripe PaymentIntent
      description: |
        Creates a Stripe checkout (payment record only). Registration is created
        when payment succeeds via /register/confirm or payment_intent.succeeded webhook.

        **Single ticket:** send `categoryId` (required) plus optional fields.

        **Group / family order:** send `lineItems` (1..max_per_order participants) instead of
        `categoryId`. Each line item includes participant type (self, account, guest), category,
        waivers, and extras. One discount code applies to the whole order.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotencyKey]
              properties:
                categoryId:
                  type: integer
                  description: Required for single-ticket checkout (omit when using lineItems)
                lineItems:
                  type: array
                  description: Group checkout participants (omit categoryId when present)
                  minItems: 1
                  items:
                    type: object
                    required: [lineId, participantType, categoryId]
                    properties:
                      lineId:
                        type: string
                        format: uuid
                      participantType:
                        type: string
                        enum: [self, account, guest]
                      accountEmail:
                        type: string
                        format: email
                      guest:
                        type: object
                        properties:
                          firstName:
                            type: string
                          lastName:
                            type: string
                          email:
                            type: string
                            format: email
                          dateOfBirth:
                            type: string
                            format: date
                          gender:
                            type: string
                      guardianRelationship:
                        type: string
                      categoryId:
                        type: integer
                      fieldValues:
                        type: object
                        additionalProperties: true
                      waiverSignatures:
                        type: array
                        items:
                          type: object
                      selectedExtras:
                        type: array
                        items:
                          type: object
                      extraFieldAnswers:
                        type: array
                        items:
                          type: object
                fieldValues:
                  type: object
                  additionalProperties: true
                idempotencyKey:
                  type: string
                waiverId:
                  type: integer
                  description: Required when event requires_waiver is true
                waiverSignature:
                  type: string
                  description: Typed signature when waiver is required
                discountCode:
                  type: string
                  description: Optional discount code to apply at checkout
                selectedExtras:
                  type: array
                  description: Optional add-on lines (extraId + quantity)
                  items:
                    type: object
                    required: [extraId, quantity]
                    properties:
                      extraId:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 99
                extraFieldAnswers:
                  type: array
                  description: Per-add-on answers for custom athlete questions
                  items:
                    $ref: "#/components/schemas/ExtraFieldAnswersInput"
      responses:
        "200":
          description: Checkout session with client secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCheckoutResponse"
        "401":
          description: Unauthorized
        "409":
          description: Already registered, sold out, or waitlist available (code waitlist_available)

  /events/{slug}/register/checkout/msi-plan:
    post:
      tags: [Marketplace]
      summary: Apply or clear Mexico MSI plan before Stripe confirm
      description: |
        Updates the pending PaymentIntent amount, application_fee_amount (Y2 uplift),
        and card installments plan. Only when the event has MSI enabled, checkout is
        Stripe, and the one-shot athlete total is at least $1,000 MXN. Group checkout
        is not supported yet. Pass planMonths null to return to contado (base fee).
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentPublicUuid]
              properties:
                paymentPublicUuid:
                  type: string
                planMonths:
                  type: integer
                  nullable: true
                  enum: [3, 6, 9]
                  description: null clears MSI (pay in full)
      responses:
        "200":
          description: Updated checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationCheckoutResponse"
        "400":
          description: MSI unavailable or invalid plan
        "401":
          description: Unauthorized
        "404":
          description: Payment not found
        "409":
          description: Payment no longer editable

