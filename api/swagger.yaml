                  type: boolean
                  description: >
                    Paid in-person cash sale at category price with provider manual,
                    zero platform commission, and metadata_json.tender=cash.
                    Requires events.manual_sales_enabled=1; otherwise 400 manual_sales_disabled.
                waiver_waived:
                  type: boolean
