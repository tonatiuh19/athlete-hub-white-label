      parameters:
        - name: publicUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [waiverSignatures]
              properties:
                waiverSignatures:
                  type: array
                  items:
                    type: object
                    required: [waiverId, signature]
                    properties:
                      waiverId:
                        type: integer
                      signature:
                        type: string
                        description: ACCEPTED checkbox token or typed name (≥3 chars)
                      waiverVersion:
                        type: integer
      responses:
        "200":
          description: Waivers re-signed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  acceptancePdfsAttached:
                    type: integer
                    description: Count of stamped PDFs emailed (0 if stamp failed)
        "400":
