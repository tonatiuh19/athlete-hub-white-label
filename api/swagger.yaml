components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppLocale:
      type: string
      enum: [es, en]
      description: >
        App UI locale. When omitted, API uses Accept-Language then defaults to `es`.
        For existing accounts, DB `preferred_language` wins for OTP/email language.
    AppTheme:
      type: string
      enum: [light, dark, system]
      description: >
        UI color theme. New athlete accounts may send `theme` on register/Clerk to seed
        `preferred_theme` from guest `localStorage` (`atleita-theme`). Auth session payloads
        always include normalized `preferredTheme`.
    LocalizedError:
      type: object
      required: [error, code]
      description: >
        User-facing API error. `error` is localized; `code` is stable for clients
        (map via i18n). Auth and many athlete/registration/payment errors use this shape.
      properties:
        error:
          type: string
          description: Localized human-readable message
        code:
          type: string
          description: >
            Stable machine code (e.g. account_not_found, event_not_found,
            waiver_required, names_required, password_policy, rate_limited).
          example: account_not_found
        retryAfterSec:
          type: integer
          description: Present for rate_limited responses
    LocalizedSuccess:
      type: object
      required: [message, code]
      description: Localized success acknowledgment (e.g. OTP / forgot-password)
      properties:
        message:
          type: string
        code:
          type: string
          enum: [verification_code_sent, forgot_password_instructions_sent]
    EventBibMode:
      type: string
      enum: [folio, separate]
      description: >
        folio = registration folio is also the race bib (dorsal); separate = folio and bib independent.
        New events default to folio; existing events migrate to separate.
    EventSubdomainAvailableResponse:
      type: object
      properties:
        available:
          type: boolean
        subdomain:
          type: string
        error:
          type: string
          description: Format or taken error code when available=false
    EventSubdomainResolveResponse:
      type: object
      properties:
        subdomain:
          type: string
        slug:
          type: string
        title:
          type: string
        canonical_path:
          type: string
          example: /events/mi-carrera
    StaffEventUpsertRequest:
      type: object
      description: >
        On create, title / subdomain / sport_type_id / start_date are required
        (enforced by API). On PATCH, subdomain is immutable — a different value
        returns 400 with code subdomain_immutable.
      properties:
        title:
          type: string
        sport_type_id:
          type: integer
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        slug:
          type: string
        subdomain:
          type: string
          description: >
            Required on create. Globally unique vanity host label for
            `{subdomain}.atleita.com`. Immutable after create.
          minLength: 3
          maxLength: 63
        short_description:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
        featured:
          type: boolean
        registration_opens_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        location_name:
          type: string
        location_city:
          type: string
        location_state:
          type: string
        max_registrations:
          type: integer
        max_registrations_per_order:
          type: integer
        bib_mode:
          $ref: "#/components/schemas/EventBibMode"
        auto_deactivate_after_event:
          type: boolean
          description: When true (default), unlist from marketplace after the event day ends
        fee_presentation:
          $ref: "#/components/schemas/FeePresentation"
        msi_enabled:
          type: boolean
          description: Offer Stripe MSI (3/6/9) on checkout when payouts are ready
        manual_sales_enabled:
          type: boolean
          description: >
            When true, staff may record cash manual sales (provider=manual) for this event.
            Default false.
    FeePresentation:
      type: string
      enum: [pass_through, absorb_all]
    RegistrationPurchasedExtra:
      type: object
      description: Add-on line purchased with a registration (snapshot at checkout time)
      properties:
        event_extra_id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unit_price_cents:
          type: integer
        total_cents:
          type: integer
        field_answers:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationPurchasedExtraFieldAnswer"
    RegistrationPurchasedExtraFieldAnswer:
      type: object
      properties:
        field_key:
          type: string
        label:
          type: string
        value_text:
          type: string
          nullable: true
        value_json:
          type: object
          nullable: true
        field_kind:
          type: string
          enum: [standard, mx_shipping_block]
        field_type:
          type: string
    EventExtraField:
      type: object
      properties:
        id:
          type: integer
        field_key:
          type: string
        label:
          type: string
        field_type:
          type: string
          enum: [text, textarea, select, checkbox, number, date]
        field_kind:
          type: string
          enum: [standard, mx_shipping_block]
        options_json:
          type: array
          items:
            type: string
          nullable: true
        is_required:
          type: boolean
        sort_order:
          type: integer
    EventExtra:
      type: object
      properties:
        id:
          type: integer
        public_uuid:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price_cents:
          type: integer
        currency:
          type: string
        image_url:
          type: string
          nullable: true
        extra_type:
          type: string
        max_per_athlete:
          type: integer
        capacity:
          type: integer
          nullable: true
        sold_count:
          type: integer
        sort_order:
          type: integer
        scope_type:
          type: string
          enum: [all_categories, selected_categories]
        sales_opens_at:
          type: string
          format: date-time
          nullable: true
        sales_closes_at:
          type: string
          format: date-time
          nullable: true
        category_ids:
          type: array
          items:
            type: integer
        fields:
          type: array
          items:
            $ref: "#/components/schemas/EventExtraField"
        sales_status:
          type: string
          enum: [open, scheduled, ended]
    StaffEventExtra:
      allOf:
        - $ref: "#/components/schemas/EventExtra"
        - type: object
          properties:
            fields_locked:
              type: boolean
    StaffEventExtraInput:
      type: object
      required: [name, price_cents]
      properties:
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
        is_free:
          type: boolean
        currency:
          type: string
        image_url:
          type: string
        extra_type:
          type: string
        max_per_athlete:
          type: integer
        capacity:
          type: integer
          nullable: true
        sort_order:
          type: integer
        scope_type:
          type: string
          enum: [all_categories, selected_categories]
        category_ids:
          type: array
          items:
            type: integer
        sales_opens_at:
          type: string
          format: date-time
          nullable: true
        sales_closes_at:
          type: string
          format: date-time
          nullable: true
        fields:
          type: array
          items:
            $ref: "#/components/schemas/EventExtraField"
    StaffEventExtraPatch:
      allOf:
        - $ref: "#/components/schemas/StaffEventExtraInput"
    ExtraFieldAnswersInput:
      type: object
      required: [extraId, values]
      properties:
        extraId:
          type: integer
        values:
          type: object
          additionalProperties: true
    RegistrationCheckoutResponse:
      type: object
      properties:
        paymentPublicUuid:
          type: string
        clientSecret:
          type: string
          nullable: true
        amountCents:
          type: integer
        registrationAmountCents:
          type: integer
        serviceFeeCents:
          type: integer
        currency:
          type: string
        categoryName:
          type: string
        eventTitle:
          type: string
        feePresentation:
          $ref: "#/components/schemas/FeePresentation"
        listPriceCents:
          type: integer
        displayIvaCents:
          type: integer
        organizerFiscalNetCents:
          type: integer
        discountCode:
          type: string
        discountAmountCents:
          type: integer
        extrasSubtotalCents:
          type: integer
        extras:
          type: array
          items:
            type: object
            properties:
              extraId:
                type: integer
              name:
                type: string
              quantity:
                type: integer
              unitPriceCents:
                type: integer
              totalCents:
                type: integer
        msiAvailable:
          type: boolean
          description: Stripe MSI available (event enabled, Stripe rail, athlete total ≥ $1,000 MXN)
        msiAllowedPlans:
          type: array
          items:
            type: integer
            enum: [3, 6, 9]
        msiPlanMonths:
          type: integer
          nullable: true
          enum: [3, 6, 9]
          description: Selected MSI plan; null means pay in full (contado)
    EventCategoryPricing:
      type: object
      properties:
        price_cents:
          type: integer
        total_cents:
          type: integer
          description: Athlete-facing checkout total for this category
        display_iva_cents:
          type: integer
        organizer_fiscal_net_cents:
          type: integer
    MarketplaceEventCard:
      type: object
      properties:
        from_price_cents:
          type: integer
          description: Minimum athlete-facing category total (includes pass-through fees)
    SpeiSettlementRow:
      type: object
      required:
        - id
        - payment_id
        - organizer_id
        - amount_cents
        - currency
        - status
        - created_at
        - updated_at
      properties:
        id: { type: integer }
