                  type: string
                  format: date
                managed_by_purchaser:
                  type: boolean
                  description: Skip claim email (auto for under-18); requires purchaser_email
                purchaser_email:
                  type: string
                  format: email
                purchaser_athlete_id:
                  type: integer
      responses:
        "201":
          description: Registration created
        "400":
          description: >
            Validation error (e.g. manual_sale combined with comp, purchaser_required,
            or manual_sales_disabled when the event flag is off)
