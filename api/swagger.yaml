  /organizer/events/{eventId}/folio-segments:
    get:
      tags: [Organizer]
      summary: List custom folio segment rules
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Folio segment rules for the event
    put:
      tags: [Organizer]
      summary: Replace custom folio segment rules
      description: >
        Rules are evaluated top to bottom by sort_order. Each rule may filter by
        category scope and coupon scope, define a pattern (tokens + literals),
        choose counter scope (segment, event, or category), and optionally set an
        inclusive end_number to reserve a folio block (e.g. 1–100). Active blocks
        with overlapping start/end ranges are rejected. When a block is full,
        new registrations for that rule fail. Unmatched registrations keep the
        legacy REG-{eventId}-{sequence} format.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Folio rules updated
        "400":
          description: Validation error
        "409":
          description: Cannot remove a segment that already issued folios

