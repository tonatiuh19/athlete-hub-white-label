openapi: 3.0.3
info:
  title: Athlete Hub API
  description: |
    REST API for the Athlete Hub sports events platform.

    ## Authentication
    - **Protected routes** require `Authorization: Bearer <session_token>`
    - **Public routes** require no authentication

    ## Base URL
    All endpoints are prefixed with `/api`.
  version: "1.0.0"
  contact:
    name: Athlete Hub Dev

servers:
  - url: /api
    description: Same-origin (development & production)

tags:
  - name: Health
    description: System health checks
  - name: Auth
    description: Passwordless OTP authentication (athlete, organizer, admin)
  - name: Marketplace
    description: Public event discovery
  - name: Athlete
    description: Athlete portal
  - name: Organizer
    description: Organizer portal
  - name: Admin
    description: Platform admin
  - name: Simulation
    description: Organizer simulation events (Stripe test kit, gated magic links)
  - name: Webhooks
    description: External service webhooks (Stripe)

paths:
  /sim/{token}:
    get:
      tags: [Simulation]
      summary: Load a gated simulation event for test checkout
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Simulation event payload (categories, fields, test cards)
        "404":
          description: Not found
  /sim/{token}/stripe-config:
    get:
      tags: [Simulation]
      summary: Stripe test publishable key for simulation Elements
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Test mode publishable key
        "503":
          description: Stripe test kit not configured
  /cron/cleanup-simulations:
    post:
      tags: [Simulation]
      summary: Wipe expired simulation generated data (keep event shell)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cleanup result
        "401":
          description: Unauthorized
  /cron/cleanup-mp-pending:
    post:
      tags: [Payments]
      summary: >
        Historical TTL cleanup for unpaid Mercado Pago pending/processing payment rows
        (legacy MP checkout). No new MP payments are created in v1.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cleanup result
        "401":
          description: Unauthorized
  /organizer/simulations:
    get:
      tags: [Simulation, Organizer]
      summary: List organizer simulations (owner only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Simulations + quota
    post:
      tags: [Simulation, Organizer]
      summary: Create or clone a simulation event (owner only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
        "400":
          description: Quota or validation error
  /admin/simulations:
    get:
      tags: [Simulation, Admin]
      summary: List all simulation events
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Simulations
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
        "503":
          description: Database disconnected

  /ping:
    get:
      tags: [Health]
      summary: Ping
      responses:
        "200":
          description: Pong

  /auth/athlete/check-email:
    post:
      tags: [Auth]
      summary: Check if an athlete account exists for an email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Whether the email is registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  hasPassword:
                    type: boolean
                  hasSocialLogin:
                    type: boolean

  /auth/athlete/request-otp:
    post:
      tags: [Auth]
      summary: Send passwordless login OTP to an existing athlete email
      description: >
        Accepts optional `locale` (`es`|`en`) and/or `Accept-Language`.
        Errors return localized `error` plus stable `code` (see LocalizedError).
        Existing accounts prefer DB `preferred_language` over body locale for OTP email language.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                locale:
                  $ref: '#/components/schemas/AppLocale'
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LocalizedSuccess'
                  - type: object
                    properties:
                      ok:
                        type: boolean
                      email:
                        type: string
        "404":
          description: No account for email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'
        "409":
          description: Social-only account — use Clerk OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'

  /auth/athlete/verify-otp:
    post:
      tags: [Auth]
      summary: Verify athlete email OTP and issue session
      description: >
        Optional `locale`. Errors use LocalizedError (`error` + `code`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
                locale:
                  $ref: '#/components/schemas/AppLocale'
      responses:
        "200":
          description: Session token returned
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'

  /auth/athlete/register:
    post:
      tags: [Auth]
      summary: Register athlete (passwordless OTP by default; password optional for legacy)
      description: >
        Omitting `password` creates the athlete and emails a one-time code
        (`requiresOtp: true`). Providing a password issues a session immediately (legacy).
        Optional `locale` sets `preferred_language` for new accounts and localizes validation
        errors (`names_required`, `date_of_birth_required`, `invalid_gender`, `password_policy`, etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, dateOfBirth]
              properties:
                email:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                password:
                  type: string
                  description: Optional — omit for passwordless OTP signup
                dateOfBirth:
                  type: string
                  format: date
                  description: YYYY-MM-DD — used for category eligibility
                gender:
                  type: string
                  enum: [male, female, other, prefer_not_to_say]
                locale:
                  $ref: '#/components/schemas/AppLocale'
                theme:
                  $ref: '#/components/schemas/AppTheme'
      responses:
        "200":
          description: Session token, or requiresOtp payload for passwordless signup
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  requiresOtp:
                    type: boolean
                  email:
                    type: string
                  message:
                    type: string
                    description: Localized success text when requiresOtp
                  code:
                    type: string
                    example: verification_code_sent
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'
        "409":
          description: Account exists / social-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'

  /auth/athlete/login:
    post:
      tags: [Auth]
      summary: Athlete email/password login (legacy)
      description: >
        Prefer `request-otp` / `verify-otp`. If `password_hash` is null, responds with
        `otp_required` and emails a login OTP (social-only → `social_account_exists`).
        Optional `locale`. Errors return LocalizedError.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                locale:
                  $ref: '#/components/schemas/AppLocale'
      responses:
        "200":
          description: Session token returned
        "403":
          description: Passwordless account — OTP emailed (`otp_required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'
        "409":
          description: Social-only account — use Clerk OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'

  /auth/athlete/forgot-password:
    post:
      tags: [Auth]
      summary: Request athlete password reset or login OTP
      description: >
        Password accounts receive a reset code. Passwordless accounts receive a login OTP
        (same as request-otp). Social-only accounts get a generic ok with no email.
        Optional `locale`. Success message is localized (`forgot_password_instructions_sent`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                locale:
                  $ref: '#/components/schemas/AppLocale'
      responses:
        "200":
          description: Always returns ok (no email enumeration)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/LocalizedSuccess'
                  - type: object
                    properties:
                      ok:
                        type: boolean

  /auth/athlete/reset-password:
    post:
      tags: [Auth]
      summary: Reset athlete password with email and 6-digit code from email
      description: >
        Optional `locale`. Validation errors use LocalizedError codes such as
        `reset_code_required`, `password_policy`, `invalid_or_expired_reset_code`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email:
                  type: string
                code:
                  type: string
                  pattern: "^\\d{6}$"
                password:
                  type: string
                locale:
                  $ref: '#/components/schemas/AppLocale'
      responses:
        "200":
          description: Password updated; may return session token
        "400":
          description: Validation or invalid reset code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalizedError'

  /auth/organizer/request-otp:
    post:
      tags: [Auth]
      summary: Request organizer OTP
      responses:
        "200":
          description: OTP sent

  /auth/organizer/verify-otp:
    post:
      tags: [Auth]
      summary: Verify organizer OTP
      responses:
        "200":
          description: Session token returned

  /auth/admin/request-otp:
    post:
      tags: [Auth]
      summary: Request admin OTP
      responses:
        "200":
          description: OTP sent

  /auth/admin/verify-otp:
    post:
      tags: [Auth]
      summary: Verify admin OTP
      responses:
        "200":
          description: Session token returned

  /auth/admin/me:
    get:
      tags: [Auth]
      summary: Current admin profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin profile
    patch:
      tags: [Auth]
      summary: Update current admin profile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                  nullable: true
                preferred_language:
                  type: string
                  enum: [es, en]
                preferred_theme:
                  type: string
                  enum: [light, dark, system]
      responses:
        "200":
          description: Updated admin profile

  /auth/admin/avatar:
    post:
      tags: [Auth]
      summary: Upload admin profile photo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Photo uploaded
    delete:
      tags: [Auth]
      summary: Remove admin profile photo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Photo removed

  /auth/organizer/me:
    get:
      tags: [Auth]
      summary: Current organizer member profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizer member profile
    patch:
      tags: [Auth]
      summary: Update current organizer member profile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                  nullable: true
                preferred_language:
                  type: string
                  enum: [es, en]
      responses:
        "200":
          description: Updated organizer member profile

  /auth/organizer/avatar:
    post:
      tags: [Auth]
      summary: Upload organizer member profile photo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Photo uploaded
    delete:
      tags: [Auth]
      summary: Remove organizer member profile photo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Photo removed

  /auth/clerk/athlete:
    post:
      tags: [Auth]
      summary: Exchange Clerk session for athlete JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionToken]
              properties:
                sessionToken:
                  type: string
      responses:
        "200":
          description: Athlete session token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out

  /sport-types:
    get:
      tags: [Marketplace]
      summary: List active sport types
      responses:
        "200":
          description: Sport types list

  /public/home:
    get:
      tags: [Marketplace]
      summary: Public home page data (live stats, all published events, leaderboards)
      responses:
        "200":
          description: Platform stats, published events, top athletes and teams

  /public/site-profile:
    get:
      tags: [Marketplace]
      summary: Public site profile (legal entity and contact page config)
      responses:
        "200":
          description: Merged site public profile with empty fields omitted in UI

  /sites/by-subdomain/{subdomain}:
    get:
      tags: [OrganizerSites]
      summary: Public published organizer microsite by vanity subdomain
      description: >
        Returns theme, sections, legal docs, and upcoming published public events.
        Draft / pending_approval events are never included.
      parameters:
        - name: subdomain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Site payload including events[]
        "404":
          description: Site not found or not published

  /organizer/site:
    get:
      tags: [OrganizerSites]
      summary: Load organizer microsite for the site editor
      description: >
        Authenticated organizer site chrome plus upcoming events including draft
        and pending_approval (editor layout preview only). Publish site does not
        publish events. Legal documents (terms/privacy/refund) are edited via
        PATCH with legal[] — required (ES, non-empty HTML) before event
        submit/approve.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Site payload including events[] and legal[]
        "401":
          description: Unauthorized
    patch:
      tags: [OrganizerSites]
      summary: Save organizer microsite draft or publish the site
      description: >
        Updates theme/sections/legal and optional site status (draft|published|suspended).
        Does not change event statuses — events require their own publish/approval flow
        and organizer ES legal docs (terms, privacy, refund) must be non-empty HTML.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subdomain:
                  type: string
                status:
                  type: string
                  enum: [draft, published, suspended]
                localeDefault:
                  type: string
                  enum: [es, en]
                theme:
                  type: object
                sections:
                  type: array
                  items:
                    type: object
                legal:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Updated site payload including events[]
        "400":
          description: Invalid subdomain or payload
        "409":
          description: Subdomain taken



  /public/organizers/register:
    post:
      tags: [Staff]
      summary: Self-service organizer registration (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - owner_first_name
                - owner_last_name
                - owner_email
                - name
                - city
              properties:
                owner_first_name:
                  type: string
                owner_last_name:
                  type: string
                owner_email:
                  type: string
                  format: email
                owner_phone:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                city:
                  type: string
                country:
                  type: string
                  default: MX
                locale:
                  type: string
                  description: >
                    UI locale from the signup form (es|en). Drives welcome-email
                    language and owner preferred_language. Falls back to
                    Accept-Language when omitted.
                intake:
                  type: object
                  properties:
                    event_name:
                      type: string
                      nullable: true
                      maxLength: 200
                    sport_type_id:
                      type: integer
                      nullable: true
                    rough_date:
                      type: string
                      format: date
                      nullable: true
                    expected_size:
                      type: string
                      enum: ["<100", "100-500", "500+"]
                      nullable: true
      responses:
        "201":
          description: Organizer created; verify email with staff OTP next
        "400":
          description: Validation error
        "409":
          description: Email already registered
        "429":
          description: Rate limited



  /events:
    get:
      tags: [Marketplace]
      summary: List published public events with search, filters, and pagination
      parameters:
        - name: q
          in: query
          description: >
            Search query (min 2 chars). Uses the same fuzzy, accent-insensitive
            matching as GET /search/suggest across title, sport, city, organizer,
            and keywords. Default sort date_asc ranks by relevance when q is set.
          schema:
            type: string
        - name: sport
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: geoCityId
          in: query
          schema:
            type: integer
          description: Canonical geo_cities id for exact city+state filtering. Unknown ids return an empty result set.
        - name: featured
          in: query
          schema:
            type: boolean
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Inclusive start of date range (compared by calendar day)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: Inclusive end of date range (compared by calendar day). Inverted ranges are normalized automatically.
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sort
          in: query
          schema:
            type: string
            enum: [date_asc, date_desc, price_asc, price_desc, popular]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Events list with total count, includes location_lat and location_lng

  /geo/states:
    get:
      tags: [Geo]
      summary: List states/provinces for a country
      parameters:
        - name: country
          in: query
          schema:
            type: string
            default: MX
      responses:
        "200":
          description: States list

  /geo/cities:
    get:
      tags: [Geo]
      summary: List cities from the geo catalog
      parameters:
        - name: country
          in: query
          schema:
            type: string
            default: MX
        - name: state_id
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Cities list with state metadata

  /geo/resolve-place:
    get:
      tags: [Geo]
      summary: Resolve coordinates for an event place pin
      description: >
        Uses event lat/lng when provided, otherwise geo_cities catalog coords,
        otherwise Nominatim geocoding (Mexico-biased).
      parameters:
        - name: country
          in: query
          schema:
            type: string
            default: MX
        - name: city
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Resolved place or null

  /events/filters/cities:
    get:
      tags: [Marketplace]
      summary: List cities with published event counts (geo catalog backed)
      responses:
        "200":
          description: Array of geo cities with id, city, state, lat, lng, and event_count

  /events/subdomain-available:
    get:
      tags: [Marketplace]
      summary: Check whether an event vanity subdomain is available
      parameters:
        - name: subdomain
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 63
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubdomainAvailableResponse"

  /events/subdomain/{subdomain}:
    get:
      tags: [Marketplace]
      summary: Resolve vanity host to canonical /events/{slug} path
      description: >
        Returns published/completed non-simulation events with visibility
        public or unlisted. Reserved-but-unpublished vanity hosts return 404
        with code `not_live`; unknown hosts return code `not_found`.
      parameters:
        - name: subdomain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published event mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSubdomainResolveResponse"
        "404":
          description: Not found or not live yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [not_found, not_live]
                  status:
                    type: string
                  visibility:
                    type: string

  /search/suggest:
    get:
      tags: [Marketplace]
      summary: Unified autocomplete for events, cities, and sports
      description: |
        City suggestions include published event locations and matches from the
        INEGI municipio catalog (geo_cities), with geoCityId when available.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Grouped search suggestions

  /events/{slug}:
    get:
      tags: [Marketplace]
      summary: Get event detail with categories, registration fields, course, and media
      description: |
        Optional Bearer athlete token. When authenticated, includes `myRegistration`
        if the athlete has a pending or confirmed registration for this event.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail (may include myRegistration for signed-in athletes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  feePresentation:
                    $ref: "#/components/schemas/FeePresentation"
                  payments_available:
                    type: boolean
                    description: False when published paid categories exist but organizer Connect payout is not ready
                  has_paid_categories:
                    type: boolean
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventCategoryPricing"
        "404":
          description: Event not found

  /athlete/me:
    get:
      tags: [Athlete]
      summary: Get current athlete profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Athlete profile
    patch:
      tags: [Athlete]
      summary: Update athlete profile (name, contact, sport details)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                  nullable: true
                date_of_birth:
                  type: string
                  format: date
                  nullable: true
                gender:
                  type: string
                  enum: [male, female, other, prefer_not_to_say]
                  nullable: true
                shirt_size:
                  type: string
                  enum: [XS, S, M, L, XL, XXL]
                  nullable: true
                country:
